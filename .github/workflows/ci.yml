name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  # Как в референсе: после зелёных тестов на main — выкладка на VM по SSH и перезапуск сервиса.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/pharmacy-stock-bot
            git fetch origin ${{ github.sha }}
            git reset --hard ${{ github.sha }}
            ~/.local/bin/uv sync --frozen --no-dev
            sudo systemctl restart pharmacy-stock-bot
            sleep 3
            systemctl is-active --quiet pharmacy-stock-bot
