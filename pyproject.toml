[project]
name = "pharmacy-stock-bot"
version = "1.0.0"
description = "Telegram-бот аптечной сети: неликвид, истекающие сроки годности, выгрузка в Google Sheets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]>=21",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "gspread>=6.0",
    "google-auth>=2.27",
    "aiohttp>=3.9",
    "pydantic-settings>=2.10",
]

[project.scripts]
pharmacy-bot = "pharmacy_bot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
    "mypy>=1.17",
    "pandas-stubs>=2.2",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmacy_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PT", "RUF", "ASYNC"]
# RUF001-003: в русских строках есть кириллица, похожая на латиницу, — это нормально.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["pharmacy_bot"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true
